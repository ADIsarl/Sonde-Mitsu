<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Thermistance CVC</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-radius: 8px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #555; }
        
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        
        /* Toggle Mode T <-> R */
        .mode-switch {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            justify-content: center;
            background: #eef2f5;
            padding: 10px;
            border-radius: 6px;
        }
        .mode-label { 
            font-weight: normal; 
            cursor: pointer; 
            margin: 0; 
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Toggle Unit Ohm <-> kOhm */
        .unit-switch {
            display: none; /* Masqué par défaut */
            gap: 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.9em;
        }
        .unit-label {
            font-weight: normal;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .result-box {
            background-color: #e9ecef;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1.5rem;
            border-left: 5px solid var(--primary-color);
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .result-item:last-child { margin-bottom: 0; }
        .label-res { color: #666; }
        .val-res { font-weight: bold; color: #000; }

        .error { color: #dc3545; text-align: center; margin-top: 1rem; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h2>Convertisseur Thermistance</h2>

    <div class="mode-switch">
        <label class="mode-label">
            <input type="radio" name="calcMode" value="TtoR" checked onchange="updateUI()"> 
            Température → Résistance
        </label>
        <label class="mode-label">
            <input type="radio" name="calcMode" value="RtoT" onchange="updateUI()"> 
            Résistance → Température
        </label>
    </div>

    <div class="form-group">
        <label for="sensorType">Type de Sonde</label>
        <select id="sensorType" onchange="calculate()">
            </select>
    </div>

    <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label id="inputLabel" for="inputValue">Température (°C)</label>
            
            <div id="unitSelector" class="unit-switch">
                <label class="unit-label">
                    <input type="radio" name="rUnit" value="ohm" onchange="calculate()"> Ω
                </label>
                <label class="unit-label">
                    <input type="radio" name="rUnit" value="kohm" checked onchange="calculate()"> kΩ
                </label>
            </div>
        </div>
        
        <input type="number" id="inputValue" step="0.1" placeholder="Entrez la valeur" oninput="calculate()">
    </div>

    <div id="resultBox" class="result-box" style="display:none;">
        <div class="result-item">
            <span class="label-res">Nominale :</span>
            <span class="val-res" id="resNominal">--</span>
        </div>
        <div class="result-item">
            <span class="label-res">Minimum (-tol) :</span>
            <span class="val-res" id="resMin">--</span>
        </div>
        <div class="result-item">
            <span class="label-res">Maximum (+tol) :</span>
            <span class="val-res" id="resMax">--</span>
        </div>
    </div>
</div>

<script>
    /* =========================================
       CONFIGURATION SONDES
       ========================================= */
    const SENSORS = {
        low: {
            name: "Low Temp (Outdoor/Pipe) - R15k@0°C",
            R_ref: 15000, T_ref_C: 0, B: 3480, tol_R_percent: 3, tol_B_percent: 2
        },
        medium: {
            name: "Medium Temp (Heatsink) - R17k@50°C",
            R_ref: 17000, T_ref_C: 50, B: 4150, tol_R_percent: 2, tol_B_percent: 3
        },
        high: {
            name: "High Temp (Discharge) - R7.465k@120°C",
            R_ref: 7465, T_ref_C: 120, B: 4057, tol_R_percent: 2, tol_B_percent: 2
        }
    };

    const KELVIN = 273.15;

    /* =========================================
       FONCTIONS DE CALCUL
       ========================================= */
    function formatOhms(ohms) {
        if (ohms >= 1000) return (ohms / 1000).toFixed(3) + " kΩ";
        return ohms.toFixed(1) + " Ω";
    }

    function getResistance(T_c, sensor, mode) {
        const T_k = T_c + KELVIN;
        const T_ref_k = sensor.T_ref_C + KELVIN;
        
        let R_ref_calc = sensor.R_ref;
        let B_calc = sensor.B;
        const factorR = sensor.tol_R_percent / 100;
        const factorB = sensor.tol_B_percent / 100;

        if (mode !== 'nom') {
            const deltaT = (1/T_k) - (1/T_ref_k);
            if (mode === 'max') {
                R_ref_calc = sensor.R_ref * (1 + factorR);
                B_calc = deltaT >= 0 ? sensor.B * (1 + factorB) : sensor.B * (1 - factorB);
            } else if (mode === 'min') {
                R_ref_calc = sensor.R_ref * (1 - factorR);
                B_calc = deltaT >= 0 ? sensor.B * (1 - factorB) : sensor.B * (1 + factorB);
            }
        }
        return R_ref_calc * Math.exp(B_calc * ((1 / T_k) - (1 / T_ref_k)));
    }

    function getTemperature(R_ohms, sensor, mode) {
        const T_ref_k = sensor.T_ref_C + KELVIN;
        const factorR = sensor.tol_R_percent / 100;
        const factorB = sensor.tol_B_percent / 100;
        
        if (mode === 'nom') {
            return calculateInv(R_ohms, sensor.R_ref, sensor.B, T_ref_k);
        } else {
            const r_opts = [sensor.R_ref * (1 - factorR), sensor.R_ref * (1 + factorR)];
            const b_opts = [sensor.B * (1 - factorB), sensor.B * (1 + factorB)];
            let vals = [];
            for (let r of r_opts) {
                for (let b of b_opts) {
                    vals.push(calculateInv(R_ohms, r, b, T_ref_k));
                }
            }
            return (mode === 'min') ? Math.min(...vals) : Math.max(...vals);
        }
    }

    function calculateInv(R, R_ref, B, T_ref_k) {
        const val = (Math.log(R / R_ref) / B) + (1 / T_ref_k);
        return (1 / val) - KELVIN;
    }

    /* =========================================
       INTERFACE
       ========================================= */
    const sensorSelect = document.getElementById('sensorType');
    for (const [key, sensor] of Object.entries(SENSORS)) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = sensor.name;
        sensorSelect.appendChild(option);
    }

    function updateUI() {
        const isTtoR = document.querySelector('input[name="calcMode"]:checked').value === 'TtoR';
        const label = document.getElementById('inputLabel');
        const input = document.getElementById('inputValue');
        const unitSelector = document.getElementById('unitSelector');
        
        if (isTtoR) {
            label.textContent = "Température (°C)";
            input.placeholder = "Ex: 25";
            unitSelector.style.display = 'none';
        } else {
            label.textContent = "Résistance"; 
            unitSelector.style.display = 'inline-flex';
            // Met à jour le placeholder selon l'unité sélectionnée
            const isKohm = document.querySelector('input[name="rUnit"]:checked').value === 'kohm';
            input.placeholder = isKohm ? "Ex: 15 (pour 15 kΩ)" : "Ex: 15000";
        }
        calculate();
    }

    function calculate() {
        let inputVal = parseFloat(document.getElementById('inputValue').value);
        const sensorKey = document.getElementById('sensorType').value;
        const sensor = SENSORS[sensorKey];
        const isTtoR = document.querySelector('input[name="calcMode"]:checked').value === 'TtoR';
        
        const resBox = document.getElementById('resultBox');
        const elNom = document.getElementById('resNominal');
        const elMin = document.getElementById('resMin');
        const elMax = document.getElementById('resMax');

        if (isNaN(inputVal)) {
            resBox.style.display = 'none';
            return;
        }
        resBox.style.display = 'block';

        if (isTtoR) {
            // MODE: Temp -> Résistance
            const rNom = getResistance(inputVal, sensor, 'nom');
            const rMin = getResistance(inputVal, sensor, 'min');
            const rMax = getResistance(inputVal, sensor, 'max');

            elNom.textContent = formatOhms(rNom);
            elMin.textContent = formatOhms(rMin);
            elMax.textContent = formatOhms(rMax);
        } else {
            // MODE: Résistance -> Temp
            
            // Conversion d'unité si kOhms est sélectionné
            const unit = document.querySelector('input[name="rUnit"]:checked').value;
            if (unit === 'kohm') {
                inputVal = inputVal * 1000;
            }

            const tNom = getTemperature(inputVal, sensor, 'nom');
            const tMin = getTemperature(inputVal, sensor, 'min');
            const tMax = getTemperature(inputVal, sensor, 'max');

            elNom.textContent = tNom.toFixed(2) + " °C";
            elMin.textContent = tMin.toFixed(2) + " °C"; 
            elMax.textContent = tMax.toFixed(2) + " °C";
        }
    }
</script>

</body>
</html>
